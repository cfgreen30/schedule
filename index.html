<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Schedule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a1a;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 20px; }
    #pin-screen {
      background: white; padding: 48px 32px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
      max-width: 380px; margin: 80px auto;
    }
    #pin-screen h1 { font-size: 1.6rem; margin-bottom: 8px; }
    #pin-screen p { color: #666; margin-bottom: 24px; }
    #pin-input {
      width: 100%; padding: 14px; font-size: 1.1rem; border: 1.5px solid #ddd;
      border-radius: 8px; text-align: center; letter-spacing: 4px; margin-bottom: 16px;
    }
    button, .btn {
      background: #2563eb; color: white; border: none; padding: 10px 18px;
      font-size: 0.95rem; border-radius: 8px; cursor: pointer; font-weight: 500;
    }
    button:hover, .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: white; color: #1a1a1a; border: 1.5px solid #ddd; }
    .btn-secondary:hover { background: #f3f4f6; }
    .error { color: #dc2626; margin-top: 12px; min-height: 1.2em; }
    #calendar-screen { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .month-nav { display: flex; align-items: center; gap: 12px; }
    .month-label { font-size: 1.4rem; font-weight: 600; min-width: 200px; text-align: center; }
    .calendar { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
    .weekday { text-align: center; padding: 12px 4px; font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); }
    .day { min-height: 120px; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; padding: 6px; cursor: pointer; }
    .day:nth-child(7n) { border-right: none; }
    .day.empty { background: #fafbfc; cursor: default; }
    .day:hover:not(.empty) { background: #f8fafc; }
    .day-number { font-size: 0.8rem; font-weight: 500; color: #64748b; margin-bottom: 4px; }
    .day.today .day-number { background: #2563eb; color: white; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
    .events { font-size: 0.7rem; line-height: 1.25; }
    .event { background: #eff6ff; color: #1e40af; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event.call { background: #fef2f2; color: #b91c1c; }
    .event.or { background: #f0fdf4; color: #166534; }
    .event.off { background: #f1f5f9; color: #475569; }
    .event.clinic { background: #fefce8; color: #a16207; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 420px; }
    .modal-content h3 { margin-bottom: 16px; }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 6px; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .event-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 0.85rem; }
    .logout { position: fixed; top: 12px; right: 12px; }
    @media (max-width: 640px) { .day { min-height: 80px; } .events { font-size: 0.6rem; } }
    /* Dark mode */
    :root { color-scheme: dark; }
    body { background: #0f1115; color: #e5e7eb; }
    #pin-screen, .calendar, .modal-content { background: #1a1d24; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #pin-screen p { color: #9ca3af; }
    #pin-input, .modal-content input, .modal-content select { background: #0f1115; color: #e5e7eb; border-color: #374151; }
    .btn-secondary { background: #1a1d24; color: #e5e7eb; border-color: #374151; }
    .btn-secondary:hover { background: #262a33; }
    .error { color: #f87171; }
    .weekdays { background: #14171d; border-bottom-color: #2a2f3a; }
    .weekday, .day-number { color: #9ca3af; }
    .day { border-color: #232733; }
    .day.empty { background: #13151a; }
    .day:hover:not(.empty) { background: #222631; }
    .event { background: #1e2a4a; color: #93c5fd; }
    .event.call { background: #3b1717; color: #fca5a5; }
    .event.or { background: #14301f; color: #86efac; }
    .event.off { background: #262a33; color: #cbd5e1; }
    .event.clinic { background: #3a2f0b; color: #fde047; }
    .modal { background: rgba(0,0,0,0.65); }
    .event-item { background: #222631; }
    /* Grid fix: keep 7 equal columns */
    .weekdays, .days { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .day, .weekday { min-width: 0; overflow: hidden; }
    .calendar { width: 100%; }
    .event { white-space: normal; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <button class="btn btn-secondary logout" id="logout-btn" style="display:none;" onclick="logout()">Log out</button>
  <div class="container">
    <div id="pin-screen">
      <h1>Schedule</h1>
      <p>Enter PIN to view</p>
      <input type="password" id="pin-input" placeholder="••••" maxlength="8" autocomplete="off">
      <button onclick="checkPin()">Enter</button>
      <div class="error" id="pin-error"></div>
    </div>
    <div id="calendar-screen">
      <div class="top-bar">
        <div class="month-nav">
          <button class="btn btn-secondary" onclick="changeMonth(-1)">←</button>
          <div class="month-label" id="month-label"></div>
          <button class="btn btn-secondary" onclick="changeMonth(1)">→</button>
        </div>
        <div>
          <button class="btn" onclick="downloadUpdated()">Download Updated Page</button>
        </div>
      </div>
      <div class="calendar">
        <div class="weekdays">
          <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
          <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div>
        </div>
        <div class="days" id="days"></div>
      </div>
      <p style="text-align:center; color:#888; margin-top:12px; font-size:0.8rem;">Click a day to edit. Download & re-upload to update the shared page.</p>
    </div>
  </div>
  <div class="modal" id="edit-modal">
    <div class="modal-content">
      <h3 id="modal-date">Edit</h3>
      <div id="event-list"></div>
      <input type="text" id="new-title" placeholder="Event title">
      <select id="new-type">
        <option value="">Default</option>
        <option value="or">OR / Day (green)</option>
        <option value="call">Call / Night (red)</option>
        <option value="clinic">Clinic (yellow)</option>
        <option value="off">Off / Vacation (gray)</option>
      </select>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="addEvent()">Add</button>
      </div>
    </div>
  </div>

    let currentDate = new Date(2026, 9, 12); // Oct 12, 2026
    let editingDate = null;
    function checkPin() {
      if (document.getElementById("pin-input").value === PIN) {
        sessionStorage.setItem("scheduleAuth", "1");
        showCalendar();
      } else {
        document.getElementById("pin-error").textContent = "Incorrect PIN";
      }
    }
    document.getElementById("pin-input").addEventListener("keypress", e => { if (e.key === "Enter") checkPin(); });
    function showCalendar() {
      document.getElementById("pin-screen").style.display = "none";
      document.getElementById("calendar-screen").style.display = "block";
      document.getElementById("logout-btn").style.display = "block";
      renderCalendar();
    }
    function logout() { sessionStorage.removeItem("scheduleAuth"); location.reload(); }
    function changeMonth(d) { currentDate.setMonth(currentDate.getMonth() + d); renderCalendar(); }
    function renderCalendar() {
      const y = currentDate.getFullYear(), m = currentDate.getMonth(), today = new Date();
      document.getElementById("month-label").textContent = currentDate.toLocaleDateString("en-US", {month:"long", year:"numeric"});
      const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
      const el = document.getElementById("days"); el.innerHTML = "";
      for (let i = 0; i < first; i++) el.appendChild(Object.assign(document.createElement("div"), {className:"day empty"}));
      for (let d = 1; d <= days; d++) {
        const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const day = document.createElement("div"); day.className = "day";
        if (today.getFullYear()===y && today.getMonth()===m && today.getDate()===d) day.classList.add("today");
        day.innerHTML = `<div class="day-number">${d}</div><div class="events"></div>`;
        const evs = schedule[dateStr] || [];
        const cont = day.querySelector(".events");
        evs.forEach(ev => {
          const e = document.createElement("div");
          e.className = "event" + (ev.type ? " "+ev.type : "");
          e.textContent = ev.title;
          cont.appendChild(e);
        });
        day.onclick = () => openEdit(dateStr, d);
        el.appendChild(day);
      }
    }
    function openEdit(dateStr, day) {
      editingDate = dateStr;
      document.getElementById("modal-date").textContent = `Edit ${day}`;
      renderEventList();
      document.getElementById("edit-modal").classList.add("open");
    }
    function renderEventList() {
      const list = document.getElementById("event-list");
      const evs = schedule[editingDate] || [];
      list.innerHTML = evs.length ? "" : "<p style='color:#888'>No events</p>";
      evs.forEach((ev,i) => {
        const item = document.createElement("div"); item.className = "event-item";
        item.innerHTML = `<span>${ev.title}</span><button onclick="removeEvent(${i})" style="padding:2px 6px;background:#fee2e2;color:#b91c1c">×</button>`;
        list.appendChild(item);
      });
    }
    function addEvent() {
      const t = document.getElementById("new-title").value.trim();
      if (!t) return;
      if (!schedule[editingDate]) schedule[editingDate] = [];
      schedule[editingDate].push({title:t, type:document.getElementById("new-type").value});
      document.getElementById("new-title").value = "";
      renderEventList(); renderCalendar();
    }
    function removeEvent(i) {
      schedule[editingDate].splice(i,1);
      if (!schedule[editingDate].length) delete schedule[editingDate];
      renderEventList(); renderCalendar();
    }
    function closeModal() { document.getElementById("edit-modal").classList.remove("open"); }
    function downloadUpdated() {
      const s = JSON.stringify(schedule, null, 2);
      const html = document.documentElement.outerHTML.replace(/let schedule = \{[\s\S]*?\};/, `let schedule = ${s};`);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], {type:"text/html"}));
      a.download = "index.html";
      a.click();
      alert("Downloaded. Drag the new index.html onto netlify.com/drop to update the live page.");
    }
    if (sessionStorage.getItem("scheduleAuth") === "1") showCalendar();
